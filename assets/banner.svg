<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#090d16; border-radius:12px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; overflow:hidden;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#080c14"/>
    </linearGradient>

    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="pill-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="pill-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="pill-grad-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="pill-grad-4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.05"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Background Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f2937" stroke-width="0.8" opacity="0.4"/>
      <circle cx="40" cy="40" r="1" fill="#374151" opacity="0.6"/>
    </pattern>
  </defs>

  <style>
    @keyframes pulseOrb {
      0% { transform: scale(1) translate(0px, 0px); opacity: 0.25; }
      50% { transform: scale(1.15) translate(-15px, 15px); opacity: 0.45; }
      100% { transform: scale(1) translate(0px, 0px); opacity: 0.25; }
    }
    @keyframes floatPill1 {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(1deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes floatPill2 {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(12px) rotate(-1deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes tagPop {
      0% { opacity: 0.7; transform: scale(0.98); }
      50% { opacity: 1; transform: scale(1.02); }
      100% { opacity: 0.7; transform: scale(0.98); }
    }
    .orb1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: center; }
    .orb2 { animation: pulseOrb 11s ease-in-out infinite reverse; transform-origin: center; }
    .pill1 { animation: floatPill1 6s ease-in-out infinite; }
    .pill2 { animation: floatPill2 7s ease-in-out infinite; }
    .streamline { stroke-dasharray: 12, 12; animation: flowLine 20s linear infinite; }
    .badge-pop { animation: tagPop 5s ease-in-out infinite; }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="360" fill="url(#bg-grad)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>

  <!-- Dynamic / Animated Ambient Light Orbs -->
  <g filter="url(#glow)">
    <circle class="orb1" cx="220" cy="110" r="180" fill="#3b82f6"/>
    <circle class="orb2" cx="980" cy="240" r="190" fill="#8b5cf6"/>
    <circle class="orb1" cx="850" cy="80" r="140" fill="#06b6d4"/>
  </g>

  <!-- Dynamic Connecting Network / Metadata Graph Lines -->
  <g opacity="0.35">
    <path class="streamline" d="M 100 290 Q 300 240 600 280 T 1100 260" fill="none" stroke="#60a5fa" stroke-width="1.8"/>
    <path class="streamline" d="M 80 80 Q 400 130 750 90 T 1120 140" fill="none" stroke="#a78bfa" stroke-width="1.5"/>
    <path class="streamline" d="M 250 330 Q 550 200 950 320" fill="none" stroke="#34d399" stroke-width="1.2"/>
  </g>

  <!-- Animated Floating Category Tags / Chips (Background Accents) -->
  <g class="pill1" opacity="0.75">
    <!-- Tag 1: Top Left -->
    <g transform="translate(90, 45)">
      <rect width="150" height="34" rx="17" fill="url(#pill-grad-1)" stroke="#38bdf8" stroke-width="1.2"/>
      <circle cx="20" cy="17" r="5" fill="#38bdf8"/>
      <text x="34" y="22" fill="#7dd3fc" font-size="12" font-weight="600" letter-spacing="0.5">#EXIF-TAGGING</text>
    </g>
    <!-- Tag 2: Top Right -->
    <g transform="translate(930, 48)">
      <rect width="170" height="34" rx="17" fill="url(#pill-grad-2)" stroke="#818cf8" stroke-width="1.2"/>
      <circle cx="20" cy="17" r="5" fill="#818cf8"/>
      <text x="34" y="22" fill="#c7d2fe" font-size="12" font-weight="600" letter-spacing="0.5">#AI-CATEGORIZATION</text>
    </g>
  </g>

  <g class="pill2" opacity="0.75">
    <!-- Tag 3: Bottom Left -->
    <g transform="translate(100, 275)">
      <rect width="140" height="34" rx="17" fill="url(#pill-grad-4)" stroke="#10b981" stroke-width="1.2"/>
      <circle cx="20" cy="17" r="5" fill="#10b981"/>
      <text x="34" y="22" fill="#6ee7b7" font-size="12" font-weight="600" letter-spacing="0.5">#DAM-SYSTEMS</text>
    </g>
    <!-- Tag 4: Bottom Right -->
    <g transform="translate(920, 272)">
      <rect width="180" height="34" rx="17" fill="url(#pill-grad-3)" stroke="#ec4899" stroke-width="1.2"/>
      <circle cx="20" cy="17" r="5" fill="#ec4899"/>
      <text x="34" y="22" fill="#f472b6" font-size="12" font-weight="600" letter-spacing="0.5">#COMPUTER-VISION</text>
    </g>
  </g>

  <!-- Central Foreground Content (Guaranteed sharp visibility above animations) -->
  <g text-anchor="middle">
    <!-- Top Super-Badge -->
    <g transform="translate(470, 72)">
      <rect width="260" height="30" rx="15" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2" opacity="0.95"/>
      <text x="130" y="20" fill="#60a5fa" font-size="12" font-weight="700" letter-spacing="1.5">⚡ CURATED AWESOME LIST</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="165" fill="url(#primary-grad)" font-size="44" font-weight="900" letter-spacing="-0.5" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.8))">
      Awesome Metadata Tagging
    </text>
    <text x="600" y="212" fill="#f8fafc" font-size="34" font-weight="800" letter-spacing="-0.5" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.8))">
      &amp; Categorization
    </text>

    <!-- Subtitle / Descriptive Tagline -->
    <text x="600" y="258" fill="#94a3b8" font-size="15" font-weight="400" letter-spacing="0.2">
      Self-Hosted DAMs • Computer Vision APIs • Multimodal AI Enrichment • File Organizers
    </text>
  </g>
</svg>
